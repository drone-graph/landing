<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Mission Control — a mission running end-to-end</title>
  <desc id="desc2">A mini Mission Control over a 12-second loop: presets pulse, the user submits a goal, gap finding decomposes the root into labelled children, workers spawn and orbit them, findings settle as satellites, a child fills, a parent rolls up. A chat ticker at the bottom narrates each event.</desc>

  <defs>
    <radialGradient id="auP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b48cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b53c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5b53c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7aa4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9be8d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9be8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coP" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#dac9ff"/>
      <stop offset="50%" stop-color="#b48cff"/>
      <stop offset="100%" stop-color="#2c1f4e"/>
    </radialGradient>
    <radialGradient id="coA" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fcdb8e"/>
      <stop offset="50%" stop-color="#f5b53c"/>
      <stop offset="100%" stop-color="#46340e"/>
    </radialGradient>
    <radialGradient id="coC" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9bbcff"/>
      <stop offset="50%" stop-color="#5b87e5"/>
      <stop offset="100%" stop-color="#142546"/>
    </radialGradient>
    <radialGradient id="coT" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#cef5e9"/>
      <stop offset="50%" stop-color="#9be0cf"/>
      <stop offset="100%" stop-color="#1d3a35"/>
    </radialGradient>
    <linearGradient id="ed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5e88ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7fe5d0" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="gg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
      <feComposite in2="SourceGraphic" operator="atop"/>
    </filter>
    <!-- Clip path to keep ticker rows from spilling outside the ticker strip -->
    <clipPath id="tickerClip"><rect x="0" y="222" width="440" height="58"/></clipPath>
  </defs>

  <!-- Field background -->
  <rect width="440" height="280" fill="#070a0f"/>

  <!-- ============ TOP CHROME (0–22) ============ -->
  <rect x="0" y="0" width="440" height="22" fill="#0b0f17"/>
  <line x1="0" y1="22" x2="440" y2="22" stroke="#1f2532"/>
  <circle cx="11" cy="11" r="2.8" fill="#3c6ef5">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="20" y="14" fill="#e3e8f1" font-size="7.5" letter-spacing="0.08em">DRONE GRAPH · MISSION CONTROL</text>
  <text x="240" y="14" fill="#5e88ff" font-size="7.5" letter-spacing="0.04em">◉ active</text>
  <!-- Cost meter -->
  <rect x="312" y="9" width="64" height="5" rx="1.5" fill="#11151f" stroke="#1f2532"/>
  <rect x="312" y="9" width="20" height="5" rx="1.5" fill="#3c6ef5">
    <animate attributeName="width" values="6;58" dur="11.5s" repeatCount="indefinite"/>
  </rect>
  <text x="384" y="14" fill="#e3e8f1" font-size="7" text-anchor="start">
    <tspan>$</tspan>
    <tspan fill="#9aa4b8">0</tspan>
    <tspan>.</tspan>
    <tspan fill="#e3e8f1">
      <animate attributeName="textContent" values="03;12;28;41;58;71;94;1.12;1.31;1.42" dur="11.5s" repeatCount="indefinite"/>
      03
    </tspan>
  </text>

  <!-- ============ SUBSTRATE EDGES (drawn before nodes so nodes overlay) ============ -->
  <g fill="none" stroke="url(#ed)" stroke-linecap="round">
    <!-- preset → root (t≈0.16) -->
    <path d="M 56,52 Q 90,84 184,110" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0;0;1;1;1;0" dur="11.5s" keyTimes="0;0.13;0.18;0.45;0.95;1" repeatCount="indefinite"/>
    </path>
    <path d="M 384,52 Q 340,84 236,110" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0;0;1;1;1;0" dur="11.5s" keyTimes="0;0.13;0.18;0.45;0.95;1" repeatCount="indefinite"/>
    </path>
    <!-- root → children (t=0.22, 0.27, 0.32) -->
    <path d="M 200,130 Q 144,160 84,186" stroke-width="0.9">
      <animate attributeName="stroke-opacity" values="0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.19;0.22;0.27;0.95;1" repeatCount="indefinite"/>
    </path>
    <path d="M 210,134 Q 210,164 210,186" stroke-width="0.9">
      <animate attributeName="stroke-opacity" values="0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.24;0.27;0.32;0.95;1" repeatCount="indefinite"/>
    </path>
    <path d="M 220,130 Q 280,160 336,186" stroke-width="0.9">
      <animate attributeName="stroke-opacity" values="0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.29;0.32;0.38;0.95;1" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ PRESET GAPS (top corners) ============ -->
  <!-- GF (active, sonar pulsing) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="11.5s" keyTimes="0;0.04;0.95;1" repeatCount="indefinite"/>
    <g transform="translate(56, 44)">
      <circle r="18" fill="url(#auP)"/>
      <circle r="9" fill="url(#coP)"/>
      <circle r="12" fill="none" stroke="#b48cff" stroke-opacity="0.6"/>
      <text y="-15" text-anchor="middle" fill="#9aa4b8" font-size="6" letter-spacing="0.04em">preset</text>
      <text y="28" text-anchor="middle" fill="#b48cff" font-size="7" letter-spacing="0.04em">gap_finding</text>
      <circle r="10" fill="none" stroke="#b48cff" stroke-opacity="0">
        <animate attributeName="r" values="9;28" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.35;0" dur="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <!-- ALIGN (more muted, occasional pulse) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="11.5s" keyTimes="0;0.04;0.95;1" repeatCount="indefinite"/>
    <g transform="translate(384, 44)">
      <circle r="15" fill="url(#auA)" opacity="0.7"/>
      <circle r="8" fill="url(#coA)"/>
      <circle r="11" fill="none" stroke="#f5b53c" stroke-opacity="0.5"/>
      <text y="-12" text-anchor="middle" fill="#9aa4b8" font-size="6" letter-spacing="0.04em">preset</text>
      <text y="26" text-anchor="middle" fill="#f5b53c" font-size="7" letter-spacing="0.04em">alignment</text>
    </g>
  </g>

  <!-- ============ ROOT (emergent, labelled) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="11.5s" keyTimes="0;0.13;0.17;0.95;1" repeatCount="indefinite"/>
    <g transform="translate(210, 116)">
      <rect x="-78" y="-30" width="156" height="14" rx="2" fill="rgba(7,10,15,0.92)" stroke="#1f2532"/>
      <text y="-21" text-anchor="middle" fill="#e3e8f1" font-size="7">operate DTC coffee storefront</text>
      <circle r="16" fill="url(#auC)"/>
      <circle r="8" fill="url(#coC)"/>
      <text y="-44" text-anchor="middle" fill="#5e6b82" font-size="5.5" letter-spacing="0.06em">USER GOAL · a91c</text>
    </g>
  </g>

  <!-- ============ EMERGENT CHILDREN (3 children, each labelled) ============ -->
  <!-- Child 1: source greens — fills teal eventually -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.22;0.26;0.3;0.95;1" repeatCount="indefinite"/>
    <g transform="translate(84, 192)">
      <circle r="14" fill="url(#auC)">
        <animate attributeName="fill" values="url(#auC);url(#auC);url(#auT)" dur="11.5s" keyTimes="0;0.65;0.72" repeatCount="indefinite" fill="freeze"/>
      </circle>
      <circle r="7" fill="url(#coC)">
        <animate attributeName="fill" values="url(#coC);url(#coC);url(#coT)" dur="11.5s" keyTimes="0;0.65;0.72" repeatCount="indefinite" fill="freeze"/>
      </circle>
      <text y="29" text-anchor="middle" fill="#9aa4b8" font-size="6.5">source greens</text>
      <!-- "filled" tag appears late -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.6;0.65;0.68;0.7;0.72;0.95;1" repeatCount="indefinite"/>
        <rect x="-14" y="-32" width="28" height="9" rx="1.5" fill="rgba(127,229,208,0.16)" stroke="#7fe5d0" stroke-width="0.6"/>
        <text y="-25" text-anchor="middle" fill="#7fe5d0" font-size="5.5" letter-spacing="0.04em">FILLED</text>
      </g>
    </g>
  </g>
  <!-- Child 2: storefront — active worker orbiting -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.27;0.31;0.34;0.95;1" repeatCount="indefinite"/>
    <g transform="translate(210, 196)">
      <circle r="14" fill="url(#auC)"/>
      <circle r="7" fill="url(#coC)"/>
      <text y="29" text-anchor="middle" fill="#9aa4b8" font-size="6.5">storefront DNS</text>
      <!-- sonar pulses (active worker) -->
      <circle r="10" fill="none" stroke="#7aa4ff" stroke-opacity="0">
        <animate attributeName="r" values="8;22" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.35;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <!-- orbiting worker drone with trail -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/>
        <g transform="translate(15, 0)">
          <circle r="2" fill="#6fd0a8" filter="url(#gg)"/>
          <circle cx="-4" cy="-1.5" r="1.4" fill="#6fd0a8" opacity="0.55"/>
        </g>
      </g>
    </g>
  </g>
  <!-- Child 3: payments — active worker -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.32;0.36;0.4;0.95;1" repeatCount="indefinite"/>
    <g transform="translate(336, 192)">
      <circle r="14" fill="url(#auC)"/>
      <circle r="7" fill="url(#coC)"/>
      <text y="29" text-anchor="middle" fill="#9aa4b8" font-size="6.5">stripe payments</text>
      <circle r="10" fill="none" stroke="#7aa4ff" stroke-opacity="0">
        <animate attributeName="r" values="8;20" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.32;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3s" repeatCount="indefinite"/>
        <g transform="translate(14, 0)">
          <circle r="2" fill="#6fd0a8" filter="url(#gg)"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ============ FINDINGS settling around children ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="11.5s" keyTimes="0;0.45;0.5;0.52;0.55;0.95;1" repeatCount="indefinite"/>
    <!-- around child 1 -->
    <g transform="translate(84, 192)" fill="#6fd0a8">
      <circle cx="0" cy="-18" r="1.6"/><circle cx="14" cy="-10" r="1.6"/>
      <circle cx="17" cy="3" r="1.6"/><circle cx="-14" cy="-10" r="1.6"/>
      <circle cx="-17" cy="3" r="1.6"/>
    </g>
    <!-- around child 2 -->
    <g transform="translate(210, 196)" fill="#6fd0a8">
      <circle cx="0" cy="-18" r="1.6"/><circle cx="13" cy="-11" r="1.6"/>
      <circle cx="-13" cy="-11" r="1.6"/>
    </g>
    <!-- around child 3 -->
    <g transform="translate(336, 192)" fill="#6fd0a8">
      <circle cx="0" cy="-18" r="1.6"/><circle cx="14" cy="-8" r="1.6"/>
    </g>
  </g>

  <!-- ============ CHAT TICKER (bottom strip, 222–280) ============ -->
  <line x1="0" y1="222" x2="440" y2="222" stroke="#1f2532"/>
  <text x="8" y="232" fill="#5e6b82" font-size="6" letter-spacing="0.06em">GLOBAL CHAT · THE HIVEMIND</text>
  <text x="432" y="232" text-anchor="end" fill="#5e6b82" font-size="6" letter-spacing="0.04em">live</text>
  <circle cx="430" cy="230" r="1.5" fill="#7fe5d0">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Ticker rows — each appears at its causal moment, slides up to make room -->
  <g clip-path="url(#tickerClip)">
    <!-- Slot 1: user goal (appears t≈0.13, slides up at t≈0.32) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; 0,-14; 0,-14; 0,-28; 0,-28; 0,-42; 0,-42; 0,0"
        keyTimes="0;0.13;0.18;0.3;0.32;0.55;0.58;0.95;1"
        dur="11.5s" repeatCount="indefinite"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1;1;0;0" dur="11.5s" keyTimes="0;0.13;0.55;0.85;0.93;0.96;1" repeatCount="indefinite"/>
        <rect x="6" y="238" width="32" height="9" rx="1.5" fill="none" stroke="#3c6ef5" stroke-width="0.6"/>
        <text x="22" y="244.5" text-anchor="middle" fill="#5e88ff" font-size="6" letter-spacing="0.04em">USER</text>
        <text x="42" y="245" fill="#e3e8f1" font-size="7">operate a DTC coffee storefront</text>
      </g>
    </g>
    <!-- Slot 2: gap_finding decomposed -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,14; 0,14; 0,0; 0,0; 0,-14; 0,-14; 0,-28; 0,-28; 0,14"
        keyTimes="0;0.3;0.32;0.55;0.58;0.7;0.72;0.95;1"
        dur="11.5s" repeatCount="indefinite"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;1;1;0;0" dur="11.5s" keyTimes="0;0.28;0.32;0.7;0.85;0.93;0.96;1" repeatCount="indefinite"/>
        <rect x="6" y="238" width="32" height="9" rx="1.5" fill="none" stroke="#b48cff" stroke-width="0.6"/>
        <text x="22" y="244.5" text-anchor="middle" fill="#b48cff" font-size="6" letter-spacing="0.04em">GF</text>
        <text x="42" y="245" fill="#e3e8f1" font-size="7">decomposed root → 3 children</text>
      </g>
    </g>
    <!-- Slot 3: worker filled -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,14; 0,14; 0,14; 0,14; 0,0; 0,0; 0,-14; 0,-14; 0,14"
        keyTimes="0;0.55;0.56;0.57;0.58;0.72;0.74;0.95;1"
        dur="11.5s" repeatCount="indefinite"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;1;1;0;0" dur="11.5s" keyTimes="0;0.55;0.57;0.58;0.85;0.92;0.95;0.96;1" repeatCount="indefinite"/>
        <rect x="6" y="238" width="32" height="9" rx="1.5" fill="none" stroke="#7fe5d0" stroke-width="0.6"/>
        <text x="22" y="244.5" text-anchor="middle" fill="#7fe5d0" font-size="6" letter-spacing="0.04em">WORK</text>
        <text x="42" y="245" fill="#e3e8f1" font-size="7">filled: 3 green-coffee suppliers shortlisted</text>
      </g>
    </g>
    <!-- Slot 4: system auto-rollup -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,14; 0,14; 0,14; 0,14; 0,14; 0,14; 0,0; 0,0; 0,14"
        keyTimes="0;0.7;0.71;0.72;0.73;0.74;0.76;0.95;1"
        dur="11.5s" repeatCount="indefinite"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" dur="11.5s" keyTimes="0;0.72;0.74;0.75;0.76;0.78;0.92;0.96;1" repeatCount="indefinite"/>
        <rect x="6" y="238" width="32" height="9" rx="1.5" fill="none" stroke="#5e6b82" stroke-width="0.6"/>
        <text x="22" y="244.5" text-anchor="middle" fill="#9aa4b8" font-size="6" letter-spacing="0.04em">SYS</text>
        <text x="42" y="245" fill="#e3e8f1" font-size="7">auto-rollup · parent gap filled</text>
      </g>
    </g>
  </g>

  <!-- Bottom-most footer with counters -->
  <line x1="0" y1="262" x2="440" y2="262" stroke="#1f2532"/>
  <text x="8" y="272" fill="#5e6b82" font-size="6.5">
    <tspan>4 gaps · 5 edges · </tspan>
    <tspan fill="#7fe5d0">2 drones live</tspan>
    <tspan> · tools: requests, stripe</tspan>
  </text>
</svg>
